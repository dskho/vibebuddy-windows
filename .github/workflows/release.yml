name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build Windows exe
        run: GOOS=windows GOARCH=amd64 go build -trimpath -o vibebuddy-windows.exe ./cmd/vibebuddy

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vibebuddy-windows.exe
          generate_release_notes: true
